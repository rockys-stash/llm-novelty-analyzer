[project]
name = "novelty"
version = "0.1.0"
description = "LLM novelty vs recombination analyzer: do computational novelty indicators agree with judgments of novelty?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "torch>=2.5",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
# Local open-weights language models through llama.cpp; only `make generate` and `make judge` need it.
llm = ["llama-cpp-python==0.3.36"]

[project.scripts]
novelty = "novelty.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
  "playwright==1.56.0",
  "httpx>=0.28.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelty"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "N812", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/novelty/experiments/*" = ["B023"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["novelty"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "llama_cpp.*", "torch.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: browser tests (need built frontend + chromium)"]
addopts = "-m 'not ui'"
